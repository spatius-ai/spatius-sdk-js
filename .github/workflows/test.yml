name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Exercise checks and packaging after a release version change
        run: npm version 0.0.0-ci.0 --no-git-tag-version --ignore-scripts
      - run: npm run check
      - run: npm run proto:generate
      - run: git diff --exit-code -- src/proto.json
      - run: npm run test:package

  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash scripts/build-opus.sh
      - run: git diff --exit-code -- src/opus.wasm codec/
      - run: npm test
        env:
          REQUIRE_FFMPEG: "1"
